project_id = "akiha"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://akiha-teal.vercel.app"
additional_redirect_urls = [
  "https://akiha-teal.vercel.app/**",
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
]
jwt_expiry = 3600
enable_signup = false

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.send-reminder]
verify_jwt = false

[functions.send-moment-notification]
verify_jwt = false
